apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: RX-5
  title: "A baseline"
spec:
  goal: The repository is an Orun baseline on the Cirrus conventions — a card and a build document that take a new product from nothing to live on stage and prod in one landing (the bucket, then the explorer), branded as its own and still installing the r2-explorer package, with gates that prove it offline
  affects:
    - blueprint.yaml
    - repo-blueprint.yaml
    - BOOTSTRAP.md
    - README.md
    - .baseline/**
    - tooling/rebrand/**
    - tooling/bootstrap/**
    - tooling/catalog/**
    - hooks/**
    - testing/**
    - docs/phases/**
    - ai/context/**
    - .github/workflows/**
    - intent.yaml
    - apps/web/**
    - infra/**
    - tests/web/**
    - specs/**
    - tasks/**
  doneWhen:
    - the pinned orun reads repo-blueprint.yaml, the card agrees with it, and orun catalog validate reports no errors
    - the product's own push-to-main plan applies cloudflare-r2 before web, enforced, and a pull request's plan holds the edge advisory
    - a product built offline pins, imports and copies the r2-explorer package under its own name, builds in the job tree orun stages with its sign-in found in nothing it wrote, dry-deploys both bindings, and serves the explorer over a local bucket read-only, then signed in
    - every component carries generated docs that agree with its manifest
    - the as-built status records the departures and what is not yet proven live
  gates:
    - checks
